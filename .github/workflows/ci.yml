name: Scheduler Function CI

on:
  push:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r sya_task_scheduler/requirements.txt
      - run: chmod +x bin/scheduler-server scripts/*.sh
      - run: npm test
      - run: scripts/package-runtime.sh linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: sya-function-scheduler-linux-x64
          path: dist/sya-function-scheduler-*-linux-x64.tar.gz

  macos-desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm test
      - run: npm run app:dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: sya-scheduler-macos-${{ runner.arch }}
          path: |
            release/*.dmg
            release/*.zip
