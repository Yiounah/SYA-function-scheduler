name: FocusFlow CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: chmod +x bin/scheduler-server scripts/*.sh
      - run: npm test

  macos-desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm test
      - run: npm run app:dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: focusflow-macos-${{ runner.arch }}
          path: |
            release/*.dmg
            release/*.zip
