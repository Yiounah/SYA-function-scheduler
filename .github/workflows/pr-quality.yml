name: Pull Request Quality

"on":
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  governance:
    name: Agent SDLC and specification contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.10'
          python-version: '3.11'

      - name: Verify agent and specification contracts
        run: scripts/verify-agent-sdlc.sh

  app-quality:
    name: App contracts and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.10'
          python-version: '3.11'

      - name: Install app dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Run app tests
        run: |
          chmod +x bin/scheduler-server scripts/*.sh
          npm test

  quality-gate:
    name: PR Quality Gate
    if: always()
    needs:
      - governance
      - app-quality
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality job
        env:
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          APP_RESULT: ${{ needs.app-quality.result }}
        run: |
          for result in \
            "$GOVERNANCE_RESULT" \
            "$APP_RESULT"; do
            if [ "$result" != "success" ]; then
              printf 'A required quality job finished with status: %s\n' "$result" >&2
              exit 1
            fi
          done
